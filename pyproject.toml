[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scanner-workstation"
version = "0.1.0"
description = "Native desktop workstation for local photogrammetry scans"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "opencv-python>=4.9",
  "numpy>=1.26",
  "psutil>=5.9",
  "pyserial>=3.5",
]

[project.scripts]
scanner-workstation = "scanner_app.main:main"

[tool.setuptools.packages.find]
include = ["scanner_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
